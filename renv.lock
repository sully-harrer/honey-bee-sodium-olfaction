    "DHARMa": {
      "Package": "DHARMa",
      "Version": "0.5.0",
      "Source": "Repository",
      "Title": "Residual Diagnostics for Hierarchical (Multi-Level / Mixed) Regression Models",
      "Date": "2026-05-06",
      "Authors@R": "c(person(\"Florian\", \"Hartig\", email = \"florian.hartig@biologie.uni-regensburg.de\", role = c(\"aut\", \"cre\"), comment=c(ORCID=\"0000-0002-6255-9059\")), person(\"Lukas\", \"Lohse\", role = \"ctb\"), person(\"Melina\", \"de Souza Leite\", role = \"ctb\", comment=c(ORCID=\"0000-0003-0505-0667\")),  person(\"Cosmina\", \"Werneke\", role = \"ctb\", comment=c(ORCID=\"0009-0008-7629-2173\")))",
      "Description": "\"Uses a simulation-based approach to create readily interpretable scaled (quantile) residuals for fitted generalized linear (mixed) models. Currently supported are linear and generalized linear (mixed) models from 'lme4' (classes 'lmerMod', 'glmerMod'), 'glmmTMB', 'GLMMadaptive', 'spaMM', and 'brms' (simple models); phylogenetic linear models from 'phylolm' (classes 'phylolm' and 'phyloglm'); generalized additive models ('gam' from 'mgcv'); 'glm' (including 'negbin' from 'MASS', but excluding quasi-distributions) and 'lm' model classes. Moreover, externally created simulations, e.g. posterior predictive simulations from Bayesian software such as 'JAGS', 'STAN', or 'BUGS' can be processed as well. The resulting residuals are standardized to values between 0 and 1 and can be interpreted as intuitively as residuals from a linear regression. The package also provides a number of plot and test functions for typical model misspecification problems, such as over/underdispersion, zero-inflation, and residual spatial, temporal and phylogenetic autocorrelation.\"",
      "Depends": [
        "R (>= 3.5.0)"
      ],
      "Imports": [
        "stats",
        "graphics",
        "utils",
        "grDevices",
        "Matrix",
        "parallel",
        "gap",
        "lmtest",
        "ape",
        "qgam (>= 1.3.2)",
        "lme4"
      ],
